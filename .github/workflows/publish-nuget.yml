name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build PdfXmpReader.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack PdfXmpReader.csproj --configuration Release --no-build --output ./nupkg

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: GDEV

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
