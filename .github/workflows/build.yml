name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test PdfXmpReader.Tests/PdfXmpReader.Tests.csproj --configuration Release --no-restore

  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test on Debian 12
        run: >-
          docker run --rm --platform linux/amd64
          --volume "$PWD:/src" --workdir /src
          mcr.microsoft.com/dotnet/sdk:8.0-bookworm-slim
          dotnet test PdfXmpReader.Tests/PdfXmpReader.Tests.csproj
          --configuration Release --runtime linux-x64
          -p:TargetFrameworks=net8.0

  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test on Alpine Linux
        run: >-
          docker run --rm --platform linux/amd64
          --volume "$PWD:/src" --workdir /src
          mcr.microsoft.com/dotnet/sdk:8.0-alpine3.22
          dotnet test PdfXmpReader.Tests/PdfXmpReader.Tests.csproj
          --configuration Release --runtime linux-musl-x64
          -p:TargetFrameworks=net8.0
